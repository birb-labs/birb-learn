name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r test

      - run: pnpm -r typecheck

      - run: pnpm --filter site run build:from-admin
        env:
          ADMIN_EXPORT_URL: ${{ secrets.ADMIN_EXPORT_URL }}
          ADMIN_EXPORT_SECRET: ${{ secrets.ADMIN_EXPORT_SECRET }}

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/site/out --project-name=birb-learn
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
